<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda Palestra</title>
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scheda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone column (max 560px), sticky header, fixed bottom tab bar; workout runs as a full-screen layer.
   Color: chalk-grey ground, plate colors from bumper discs (red 25 kg, blue 20, yellow 15, green 10) tag exercise types. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E4E8EE; --ink:#131820; --muted:#596273; --line:#D6DBE3;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#F9E3E6;
  --t-pesi:#C8102E; --t-mac:#1F5FBF; --t-corpo:#B98A00; --t-cardio:#23824F;
  --ok:#23824F; --shadow:0 1px 2px rgba(19,24,32,.06),0 4px 14px rgba(19,24,32,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --surface-2:#20252E; --ink:#ECEFF4; --muted:#98A1B0; --line:#2A303A;
  --accent:#FF4A5C; --accent-ink:#1A0508; --accent-soft:#3A1A20;
  --t-pesi:#FF5A6A; --t-mac:#5B9BFF; --t-corpo:#F2C230; --t-cardio:#4CC27E;
  --ok:#4CC27E; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#20252E; --ink:#ECEFF4; --muted:#98A1B0; --line:#2A303A;
  --accent:#FF4A5C; --accent-ink:#1A0508; --accent-soft:#3A1A20;
  --t-pesi:#FF5A6A; --t-mac:#5B9BFF; --t-corpo:#F2C230; --t-cardio:#4CC27E;
  --ok:#4CC27E; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
html,body{height:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;margin:0;line-height:1;flex:1;min-width:0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)}
.iconbtn{border:0;background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:20px;height:20px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger.armed{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc,var(--muted));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tc,var(--muted)) 55%,transparent)}
.t-pesi{--tc:var(--t-pesi)} .t-macchinario{--tc:var(--t-mac)} .t-corpo{--tc:var(--t-corpo)} .t-cardio{--tc:var(--t-cardio)}

/* Routine list */
.routine h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.routine .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin-block:6px 10px}
.plates{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.plates span{height:8px;flex:1;min-width:14px;max-width:40px;border-radius:4px;background:var(--tc)}
.routine .actions{display:grid;grid-template-columns:1fr auto;gap:8px}
.example-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:3px 8px;border-radius:99px}

/* Editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
.title-input{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;padding:8px 12px}
.item{padding:14px}
.item .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.item .idx{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--muted);width:28px;flex:none}
.item .name{font-weight:700;font-size:17px;line-height:1.2}
.item .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.item .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.item .grid .input{padding:8px;text-align:center;font-weight:700;font-size:17px}
.item .tools{display:flex;gap:4px;flex:none}
.item .tools button{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.item .tools button svg{width:16px;height:16px}
.item .tools button:disabled{opacity:.35}
@media (max-width:380px){.item .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Exercise library */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.group h3{font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 6px;color:var(--muted)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list button.li{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.list button.li:first-child{border-top:0}
.list .li .nm{font-weight:600}
.list .li .added{color:var(--ok);font-weight:700;font-size:14px}

/* History */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.session h4{margin:0;font-size:17px}
.session ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.session li{display:flex;gap:8px;justify-content:space-between}
.session li span:last-child{color:var(--muted);white-space:nowrap}
.session li > span:first-child{min-width:0}

.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .sh-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
.sheet .sh-body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0;padding-bottom:4px}

/* Workout layer */
.run{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.run .in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.run .bar{display:flex;align-items:center;gap:10px}
.run .bar .rn{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .clock{font-family:var(--f-display);font-weight:700;font-size:22px}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.done{background:var(--ok)}
.prog span.cur{background:var(--accent)}
.ex-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.ex-card h2{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.ex-card .note{font-size:14px;color:var(--muted)}
.ex-card .photo{display:block;width:100%;max-width:100%;aspect-ratio:4/3;max-height:240px;object-fit:cover;border-radius:14px;border:0;padding:0;background:var(--surface-2);cursor:zoom-in}
.ex-card .photo img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.callout{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
details.how{background:var(--surface-2);border-radius:12px;padding:10px 12px}
details.how summary{font-weight:700;cursor:pointer;font-size:15px}
details.how p{margin:8px 0 0;white-space:pre-line;font-size:15px;line-height:1.5}
.ex-card textarea.input{font-size:15px;min-height:0}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.photo-edit{display:flex;flex-direction:column;gap:8px}
.photo-edit img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--surface-2)}
.photo-edit .row .btn{flex:1}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(5,6,8,.94);display:grid;place-items:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.viewer img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.session .snote{margin-top:8px;font-size:14px;white-space:pre-line;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.session li small{display:block;color:var(--muted);white-space:normal;font-size:13px}
.bigs{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.big{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.big small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big b{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;overflow-wrap:anywhere}
.big b em{font-style:normal;font-size:22px;color:var(--muted);margin-left:2px}
.wt{display:flex;align-items:center;gap:4px}
.wt button{border:0;background:var(--surface);width:34px;height:40px;border-radius:10px;font-weight:800;font-size:20px;flex:none;box-shadow:var(--shadow)}
.wt input{width:100%;min-width:0;border:0;background:none;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,9vw,40px);text-align:center;padding:0;-moz-appearance:textfield}
.wt input::-webkit-inner-spin-button,.wt input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.sets span.done{background:var(--ok);color:var(--surface);box-shadow:none}
.sets span.cur{box-shadow:inset 0 0 0 2.5px var(--accent);color:var(--ink)}
.go{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em;min-height:68px;border-radius:16px}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upnext{font-size:14px;color:var(--muted)}
.upnext b{color:var(--ink)}

.rest{position:fixed;inset:0;z-index:38;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.rest .lbl{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.75}
.ring{width:min(72vw,280px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),color-mix(in srgb,var(--bg) 18%,transparent) 0)}
.ring div{width:86%;aspect-ratio:1;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.ring b{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,20vw,96px);line-height:1}
.rest .nx{max-width:32ch;font-size:16px}
.rest .nx b{display:block;font-family:var(--f-display);font-size:26px;text-transform:uppercase}
.rest .ctr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rest .ctr .btn{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg);min-width:84px}
.rest .ctr .btn.primary{background:var(--accent);color:var(--accent-ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sezioni"><div class="in">
  <button data-tab="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Schede</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Esercizi</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Storico</button>
</div></nav>
<div id="layer"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
const TYPES = {
  pesi:{label:'Pesi liberi'}, macchinario:{label:'Macchinario'}, corpo:{label:'Corpo libero'}, cardio:{label:'Cardio'}
};
const hasWeight = t => t === 'pesi' || t === 'macchinario';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKg = n => (Math.round(n * 100) / 100).toLocaleString('it-IT');
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const restLabel = s => s >= 60 ? (s % 60 ? mmss(s) : (s / 60) + ' min') : s + ' s';

const ICON = {
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
};

/* ---------- Default data (starting catalog + one example routine) ---------- */
const DEF_EX = [
  ['Panca piana bilanciere','pesi','Petto'],['Panca inclinata manubri','pesi','Petto'],['Chest press','macchinario','Petto'],['Croci ai cavi','macchinario','Petto'],

/* ---------- Storage: only on this device (localStorage) ---------- */
const KEYS = ['exercises', 'routines', 'history'];
const S = {};
const lsGet = k => { try { const v = localStorage.getItem('scheda.' + k); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('scheda.' + k, JSON.stringify(v)); } catch {} };
for (const k of KEYS) { const v = lsGet(k); S[k] = Array.isArray(v) ? v : defaults[k](); }

function save(k) { lsSet(k, S[k]); }
function syncHTML() {
  return `<button class="iconbtn" data-act="backup" aria-label="Backup dei dati"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>`;
}
/* Photos live in IndexedDB (too big for localStorage); exercises carry photo:true. */
const photoDB = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('scheda', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('photos', mode); const req = fn(t.objectStore('photos'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  return { get:k => tx('readonly', st => st.get(k)), set:(k, v) => tx('readwrite', st => st.put(v, k)), del:k => tx('readwrite', st => st.delete(k)) };
})();
const photoURL = {};
async function loadPhotos() {
  for (const e of S.exercises) {
    if (!e.photo || photoURL[e.id]) continue;
    try { const b = await photoDB.get(e.id); if (b) photoURL[e.id] = URL.createObjectURL(b); else delete e.photo; } catch {}
  }
  render();
}
async function setPhoto(id, blob) {
  if (photoURL[id]) { URL.revokeObjectURL(photoURL[id]); delete photoURL[id]; }
  if (blob) { await photoDB.set(id, blob); photoURL[id] = URL.createObjectURL(blob); }
  else await photoDB.del(id);
}
function shrinkImage(file, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
async function prepareBackup() {
  const photos = {};
  for (const e of S.exercises) if (e.photo) { try { const b = await photoDB.get(e.id); if (b) photos[e.id] = await blobToDataURL(b); } catch {} }
  const data = {app:'scheda-palestra', version:2, exportedAt:new Date().toISOString(), exercises:S.exercises, routines:S.routines, history:S.history, photos};
  const name = 'scheda-palestra-' + new Date().toISOString().slice(0, 10) + '.json';
  return new File([JSON.stringify(data)], name, {type:'application/json'});
}
function exportData(file) {
  if (!file) return;
  const blob = file, name = file.name;
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    navigator.share({files:[file], title:'Backup Scheda Palestra'}).catch(() => {});
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (d.app !== 'scheda-palestra' || !KEYS.every(k => Array.isArray(d[k]))) throw 0;
      KEYS.forEach(k => { S[k] = d[k]; save(k); });
      const ph = d.photos || {};
      Promise.all(S.exercises.map(async e => {
        if (ph[e.id]) { try { await setPhoto(e.id, await (await fetch(ph[e.id])).blob()); e.photo = true; } catch { delete e.photo; } }
        else { delete e.photo; try { await setPhoto(e.id, null); } catch {} }
      })).then(() => { save('exercises'); render(); });
      toast('Backup ripristinato'); closeSheet();
    } catch { toast('File non valido: scegli un backup di Scheda Palestra'); }
  };
  fr.readAsText(file);
}
try { navigator.storage?.persist?.(); } catch {}

function estMinutes(r) {
  let s = 0;
  for (const it of r.items) {
    const ex = exById(it.exId); const n = +it.sets || 0;
    const work = ex && ex.type === 'cardio' ? (parseInt(it.reps) || 10) * 60 : 40;
    s += n * work + Math.max(0, n - 1) * (+it.rest || 0) + (+it.rest || 0);
  }
  return Math.max(1, Math.round(s / 60));
}

function groupedList(list, act, addedIds) {
  const groups = {};
  list.forEach(e => (groups[e.muscle || 'Altro'] ||= []).push(e));
  const keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'it'));
  if (!keys.length) return `<div class="empty"><b>Nessun esercizio trovato</b>Prova un'altra ricerca o creane uno nuovo.</div>`;
  return keys.map(g => `<section class="group"><h3>${esc(g)}</h3><div class="list">${
    groups[g].sort((a, b) => a.name.localeCompare(b.name, 'it')).map(e => {
      const n = addedIds ? addedIds.filter(x => x === e.id).length : 0;
      return `<button class="li" data-act="${act}" data-id="${e.id}">${photoURL[e.id] ? `<img class="thumb" src="${photoURL[e.id]}" alt="">` : ''}<span class="grow"><span class="nm">${esc(e.name)}</span><br><span class="tag t-${e.type}">${TYPES[e.type].label}</span></span>${n ? `<span class="added">Aggiunto${n > 1 ? ' ×' + n : ''}</span>` : ''}</button>`;

function sessionVolume(h) { return h.items.reduce((a, it) => a + (it.weight ? (+it.weight || 0) * (parseInt(it.reps) || 0) * (it.done || 0) : 0), 0); }

  const list = [...S.history].sort((a, b) => b.date.localeCompare(a.date)).map(h => {

const $layer = document.getElementById('layer');
let tick = null, audio = null, wake = null;
function saveRun() { if (run) lsSet('run', run); else { try { localStorage.removeItem('scheda.run'); } catch {} } }
function startRun(r) {
  run = {routineId:r.id, name:r.name || 'Allenamento', startedAt:Date.now(), idx:0, restEnd:null, restTotal:0, confirm:false, finished:false, updateW:true,
    items:r.items.map(it => { const ex = exById(it.exId) || {name:'Esercizio', type:'corpo', notes:''};
      return {itemId:it.id, exId:it.exId, name:ex.name, type:ex.type, notes:ex.notes || '', how:ex.how || '', note:it.note || '', today:'', sets:Math.max(1, +it.sets || 1), reps:it.reps || '', rest:+it.rest || 0, weight:hasWeight(ex.type) ? (it.weight === '' ? '' : +it.weight || 0) : '', origW:it.weight, done:0}; })};
  saveRun(); requestWake(); renderRun();
}
function requestWake() { try { navigator.wakeLock?.request('screen').then(w => wake = w).catch(() => {}); } catch {} }
function beep(n = 3) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < n; i++) {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.28;
      o.frequency.value = i === n - 1 ? 1320 : 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.start(t); o.stop(t + 0.24);
    }
  } catch {}
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
}
function unlockAudio() { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {} }

function curPos() {
  const it = run.items[run.idx];
  return {it, setNo:Math.min(it.done + 1, it.sets)};
}
function nextLabel() {
  const it = run.items[run.idx];
  if (it.done < it.sets) return {title:it.name, sub:`Serie ${it.done + 1} di ${it.sets}`};
  const n = run.items.slice(run.idx + 1).find(x => x.done < x.sets);
  return n ? {title:n.name, sub:'Prossimo esercizio'} : null;
}
function advanceIfDone() {
  const it = run.items[run.idx];
  if (it.done >= it.sets) {
    const ni = run.items.findIndex((x, i) => i > run.idx && x.done < x.sets);
    const any = ni >= 0 ? ni : run.items.findIndex(x => x.done < x.sets);
    if (any >= 0) run.idx = any; else run.finished = true;
  }
}
function setDone() {
  unlockAudio();
  const it = run.items[run.idx];
  if (it.done < it.sets) it.done++;
  const allDone = run.items.every(x => x.done >= x.sets);
  if (!allDone && it.rest > 0) { run.restTotal = it.rest; run.restEnd = Date.now() + it.rest * 1000; }
  if (allDone) run.finished = true;
  saveRun(); renderRun();
}
function endRest() { run.restEnd = null; advanceIfDone(); saveRun(); renderRun(); }

function renderRun() {
  clearInterval(tick);
  if (!run || !run.open) { $layer.innerHTML = ''; return; }
  if (run.finished) { $layer.innerHTML = finishHTML(); return; }
  const {it, setNo} = curPos();
  const elapsed = () => mmss((Date.now() - run.startedAt) / 1000);
  const w = hasWeight(it.type);
  const nextEx = run.items.slice(run.idx + 1).find(x => x.done < x.sets);
  let html = `<div class="run"><div class="in">
    <div class="bar"><button class="btn ${run.confirm ? 'danger armed' : 'ghost'}" data-act="end">${run.confirm ? 'Sì, termina' : 'Termina'}</button><span class="rn">${esc(run.name)}</span><button class="iconbtn" data-act="minimize" aria-label="Riduci">${ICON.down}</button></div>
    <div class="row"><div class="prog grow" aria-label="Avanzamento">${run.items.map((x, i) => `<span class="${x.done >= x.sets ? 'done' : i === run.idx ? 'cur' : ''}"></span>`).join('')}</div><span class="clock num" id="clock">${elapsed()}</span></div>
    <section class="ex-card">
      <div class="row"><span class="tag t-${it.type}">${TYPES[it.type] ? TYPES[it.type].label : ''}</span><span class="grow"></span><span class="eyebrow num">Esercizio ${run.idx + 1}/${run.items.length}</span></div>
      <h2>${esc(it.name)}</h2>
      ${photoURL[it.exId] ? `<button class="photo" data-act="zoom" data-id="${it.exId}" aria-label="Ingrandisci la foto"><img src="${photoURL[it.exId]}" alt=""></button>` : ''}
      ${it.note ? `<div class="callout">${esc(it.note)}</div>` : ''}
      ${it.notes ? `<div class="note">Regolazioni: ${esc(it.notes)}</div>` : ''}
      ${it.how ? `<details class="how" data-k="how" ${run.open_how ? 'open' : ''}><summary>Come si esegue</summary><p>${esc(it.how)}</p></details>` : ''}
      <div class="bigs">
        <div class="big"><small>${it.type === 'cardio' ? 'Durata' : 'Ripetizioni'}</small><b class="num">${esc(it.reps || '–')}${it.type === 'cardio' && /^\d+$/.test(it.reps) ? '<em>min</em>' : ''}</b></div>
        ${w ? `<div class="big"><small>Peso kg</small><div class="wt"><button data-act="w" data-d="-2.5" aria-label="Meno 2,5 kg">−</button><input id="runw" class="num" type="number" inputmode="decimal" step="0.5" min="0" value="${esc(it.weight)}" aria-label="Peso in kg"><button data-act="w" data-d="2.5" aria-label="Più 2,5 kg">+</button></div></div>`
            : `<div class="big"><small>Recupero</small><b class="num">${it.rest ? esc(restLabel(it.rest)) : '–'}</b></div>`}
      </div>
      <div><div class="eyebrow" style="margin-bottom:8px">Serie ${setNo} di ${it.sets}${w ? ' · recupero ' + esc(restLabel(it.rest)) : ''}</div>
      <div class="sets num">${Array.from({length:it.sets}, (_, i) => `<span class="${i < it.done ? 'done' : i === it.done ? 'cur' : ''}">${i + 1}</span>`).join('')}</div></div>
      <details class="how" data-k="today" ${run.open_today || it.today ? 'open' : ''}><summary>Nota di oggi</summary><textarea class="input" id="runexnote" rows="2" style="margin-top:8px" placeholder="Es. spalla tirava sull'ultima serie, la prossima volta +2,5 kg">${esc(it.today)}</textarea></details>
    </section>
    <button class="btn primary block go" data-act="set-done">${it.done >= it.sets ? 'Esercizio completato' : 'Serie fatta'}</button>
    <div class="navrow"><button class="btn ghost" data-act="ex-prev" ${run.idx === 0 ? 'disabled' : ''}>${ICON.back} Precedente</button><button class="btn ghost" data-act="ex-next" ${run.idx === run.items.length - 1 ? 'disabled' : ''}>Salta esercizio</button></div>
    ${nextEx ? `<div class="upnext">Dopo: <b>${esc(nextEx.name)}</b> · ${nextEx.sets}×${esc(nextEx.reps)}${nextEx.weight !== '' ? ' · ' + fmtKg(+nextEx.weight) + ' kg' : ''}</div>` : ''}
  </div></div>`;
  if (run.restEnd) {
    const nx = nextLabel();
    html += `<div class="rest" role="timer"><div class="lbl">Recupero</div>
      <div class="ring" id="ring" style="--p:${Math.max(0, Math.min(1, (run.restEnd - Date.now()) / 1000 / run.restTotal))}"><div><b class="num" id="rt">${mmss((run.restEnd - Date.now()) / 1000)}</b></div></div>
      ${nx ? `<div class="nx">${esc(nx.sub)}<b>${esc(nx.title)}</b></div>` : ''}
      <div class="ctr"><button class="btn" data-act="rest-add" data-d="-15">−15 s</button><button class="btn" data-act="rest-add" data-d="15">+15 s</button><button class="btn primary" data-act="rest-skip">Vai</button></div></div>`;
  }
  $layer.innerHTML = html;
  tick = setInterval(() => {
    const c = document.getElementById('clock'); if (c) c.textContent = elapsed();
    if (run && run.restEnd) {
      const left = (run.restEnd - Date.now()) / 1000;
      const rt = document.getElementById('rt'), ring = document.getElementById('ring');
      if (rt) rt.textContent = mmss(Math.ceil(left));
      if (ring) ring.style.setProperty('--p', Math.max(0, Math.min(1, left / run.restTotal)));
      if (left <= 0) { beep(); endRest(); }
    }
  }, 250);
}
function finishHTML() {
  const dur = Math.round((Date.now() - run.startedAt) / 1000);
  const done = run.items.reduce((a, x) => a + x.done, 0), tot = run.items.reduce((a, x) => a + x.sets, 0);
  const changed = run.items.some(x => x.weight !== '' && +x.weight !== +x.origW);
  return `<div class="run"><div class="in">
    <div class="eyebrow">Allenamento finito</div>
    <h2 style="font-family:var(--f-display);font-size:44px;line-height:.95;text-transform:uppercase;margin:0">${esc(run.name)}</h2>
    <div class="stats num"><div class="stat"><b>${mmss(dur)}</b><span>Durata</span></div><div class="stat"><b>${done}/${tot}</b><span>Serie</span></div><div class="stat"><b>${fmtKg(Math.round(sessionVolume({items:run.items})))}</b><span>Kg totali</span></div></div>
    <div class="card session"><ul style="margin:0">${run.items.map(it => `<li class="num"><span>${esc(it.name)}</span><span>${it.done}/${it.sets} × ${esc(it.reps)}${it.weight !== '' ? ' · ' + fmtKg(+it.weight) + ' kg' : ''}</span></li>`).join('')}</ul></div>
    ${changed ? `<label class="check"><input type="checkbox" id="updw" ${run.updateW ? 'checked' : ''}><span>Aggiorna nella scheda i pesi che hai cambiato oggi</span></label>` : ''}
    <div class="field"><label for="runnote">Note sull'allenamento</label><textarea class="input" id="runnote" rows="3" placeholder="Es. poco sonno, energia bassa. Panca ottima.">${esc(run.note || '')}</textarea></div>
    <button class="btn primary block go" data-act="save-run">Salva nello storico</button>
    <div class="navrow"><button class="btn ghost" data-act="back-run">Torna all'allenamento</button><button class="btn danger" data-act="discard-run">Non salvare</button></div>
  </div></div>`;
}
function closeRun() { run = null; saveRun(); clearInterval(tick); try { wake?.release(); } catch {} wake = null; render(); }

/* ---------- Events ---------- */
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; ui.edit = null; ui.armed = null; ui.q = ''; ui.filter = 'all'; render(); window.scrollTo(0, 0);
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'scrim' && e.target !== b) return;
  const keepArm = ['del-routine', 'del-h', 'del-ex', 'end'].includes(act);
  if (!keepArm) { ui.armed = null; if (run) run.confirm = false; }
  const r = ui.edit && S.routines.find(x => x.id === ui.edit);
  switch (act) {
    case 'start': { const rt = S.routines.find(x => x.id === id); if (!run) startRun(rt); else if (run.routineId !== id) toast('Hai già un allenamento in corso: termina quello prima.'); run.open = true; saveRun(); renderRun(); break; }
    case 'resume': run.open = true; requestWake(); renderRun(); break;
    case 'minimize': run.open = false; saveRun(); render(); break;
    case 'edit': ui.edit = id; render(); window.scrollTo(0, 0); break;
    case 'new-routine': { const nr = {id:uid(), name:'', items:[]}; S.routines.push(nr); save('routines'); ui.edit = nr.id; render(); setTimeout(() => document.getElementById('rname')?.focus(), 50); break; }
    case 'close-edit': ui.edit = null; render(); break;
    case 'del-routine':
      if (ui.armed === 'del-' + r.id) { S.routines = S.routines.filter(x => x.id !== r.id); save('routines'); ui.edit = null; ui.armed = null; toast('Scheda eliminata'); }
      else ui.armed = 'del-' + r.id;
      render(); break;
    case 'mv': case 'rm-item': {
      const iid = b.closest('[data-item]').dataset.item; const i = r.items.findIndex(x => x.id === iid);
      if (act === 'rm-item') r.items.splice(i, 1);
      else { const j = i + (+b.dataset.d); [r.items[i], r.items[j]] = [r.items[j], r.items[i]]; }
      delete r.example; save('routines'); render(); break;
    }
    case 'pick': ui.q = ''; ui.filter = 'all'; openSheet({kind:'pick', added:[]}); break;
    case 'pick-ex': {
      const ex = exById(id);
      r.items.push({id:uid(), exId:id, sets:ex.type === 'cardio' ? 1 : 3, reps:ex.type === 'cardio' ? '20' : ex.type === 'corpo' ? '12' : '10', rest:ex.type === 'cardio' ? 0 : 90, weight:hasWeight(ex.type) ? 0 : ''});
      delete r.example; save('routines'); sheetCtx.added.push(id); renderSheet(); render(); toast(ex.name + ' aggiunto'); break;
    }
    case 'filter': ui.filter = b.dataset.v; if (sheetCtx) renderSheet(); else render(); break;
    case 'new-ex': openSheet({kind:'ex', id:null, draft:{name:ui.q, type:'macchinario', muscle:'', notes:''}}); setTimeout(() => document.getElementById('exn')?.focus(), 50); break;
    case 'open-ex': { const ex = exById(id); openSheet({kind:'ex', id, draft:{...ex}, preview:photoURL[id] || null}); break; }
    case 'rm-photo': sheetCtx.photo = null; sheetCtx.preview = null; renderSheet(); break;
    case 'save-ex': {
      const c = sheetCtx, d = c.draft; d.name = (d.name || '').trim();
      if (!d.name) { toast('Scrivi il nome dell\'esercizio'); document.getElementById('exn')?.focus(); break; }
      if (c.busy) { toast('Attendi il caricamento della foto'); break; }
      const xid = c.id || uid();
      if (c.photo !== undefined) {
        if (c.photo) d.photo = true; else delete d.photo;
        setPhoto(xid, c.photo).then(render).catch(() => toast('Foto non salvata: memoria del telefono piena?'));
      }
      if (c.id) { const ex = exById(c.id); Object.keys(ex).forEach(k => k !== 'id' && delete ex[k]); Object.assign(ex, d, {id:c.id}); }
      else S.exercises.push({...d, id:xid});
      save('exercises'); toast(c.id ? 'Esercizio aggiornato' : 'Esercizio creato'); closeSheet(); break;
    }
    case 'del-ex':
      if (ui.armed === 'ex') {
        const xid = sheetCtx.id; S.exercises = S.exercises.filter(x => x.id !== xid); setPhoto(xid, null).catch(() => {});
        S.routines.forEach(rr => rr.items = rr.items.filter(it => it.exId !== xid));
        save('exercises'); save('routines'); ui.armed = null; toast('Esercizio eliminato'); closeSheet();
      } else { ui.armed = 'ex'; renderSheet(); }
      break;
    case 'backup': { const c = {kind:'backup', file:null}; openSheet(c); prepareBackup().then(f => { c.file = f; if (sheetCtx === c) renderSheet(); }); break; }
    case 'export': exportData(sheetCtx && sheetCtx.file); break;
    case 'scrim': case 'close-sheet': closeSheet(); break;
    case 'del-h':
      if (ui.armed === 'h-' + id) { S.history = S.history.filter(h => h.id !== id); save('history'); ui.armed = null; }
      else ui.armed = 'h-' + id;
      render(); break;
    /* workout */
    case 'set-done': if (run.items[run.idx].done >= run.items[run.idx].sets) { advanceIfDone(); saveRun(); renderRun(); } else setDone(); break;
    case 'w': { const it = run.items[run.idx]; it.weight = Math.max(0, Math.round(((+it.weight || 0) + (+b.dataset.d)) * 100) / 100); saveRun(); const inp = document.getElementById('runw'); if (inp) inp.value = it.weight; break; }
    case 'rest-add': run.restEnd += (+b.dataset.d) * 1000; run.restTotal = Math.max(run.restTotal, (run.restEnd - Date.now()) / 1000); if (run.restEnd <= Date.now()) endRest(); else saveRun(); break;
    case 'rest-skip': endRest(); break;
    case 'zoom': { const v = document.createElement('div'); v.className = 'viewer'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Foto'); v.innerHTML = `<img src="${photoURL[id]}" alt="">`; v.addEventListener('click', () => v.remove()); document.body.appendChild(v); break; }
    case 'ex-prev': run.idx = Math.max(0, run.idx - 1); saveRun(); renderRun(); break;
    case 'ex-next': run.idx = Math.min(run.items.length - 1, run.idx + 1); saveRun(); renderRun(); break;
    case 'end': if (run.confirm) { run.confirm = false; run.finished = true; run.restEnd = null; } else run.confirm = true; saveRun(); renderRun(); break;
    case 'back-run': run.finished = false; if (run.items.every(x => x.done >= x.sets)) run.idx = run.items.length - 1; saveRun(); renderRun(); break;
    case 'discard-run': closeRun(); toast('Allenamento non salvato'); break;
    case 'save-run': {
      const upd = document.getElementById('updw')?.checked;
      S.history.push({id:uid(), date:new Date(run.startedAt).toISOString(), name:run.name, duration:Math.round((Date.now() - run.startedAt) / 1000), note:(run.note || '').trim(),
        items:run.items.map(it => ({name:it.name, type:it.type, sets:it.sets, done:it.done, reps:it.reps, weight:it.weight, note:(it.today || '').trim()}))});
      save('history');
      if (upd) { const rt = S.routines.find(x => x.id === run.routineId); if (rt) { run.items.forEach(it => { const ri = rt.items.find(x => x.id === it.itemId); if (ri && it.weight !== '') ri.weight = it.weight; }); save('routines'); } }
      ui.tab = 'history'; ui.edit = null; closeRun(); toast('Allenamento salvato'); break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-rname]')) { const r = S.routines.find(x => x.id === ui.edit); r.name = t.value; delete r.example; save('routines'); return; }
  if (t.matches('[data-f]')) {
    const r = S.routines.find(x => x.id === ui.edit); const it = r.items.find(x => x.id === t.closest('[data-item]').dataset.item);
    const f = t.dataset.f; it[f] = (f === 'reps' || f === 'note') ? t.value : (t.value === '' ? '' : +t.value); delete r.example; save('routines'); return;
  }
  if (t.id === 'exq' || t.id === 'pkq') {
    ui.q = t.value;
    const box = document.getElementById(t.id === 'exq' ? 'exlist' : 'pklist');
    box.innerHTML = groupedList(filteredExercises(), t.id === 'exq' ? 'open-ex' : 'pick-ex', sheetCtx && sheetCtx.added);
    return;
  }
  if (t.matches('[data-d]') && sheetCtx && sheetCtx.kind === 'ex') { sheetCtx.draft[t.dataset.d] = t.value; return; }
  if (t.id === 'runw' && run) { run.items[run.idx].weight = t.value === '' ? 0 : +t.value; saveRun(); return; }
  if (t.id === 'updw' && run) { run.updateW = t.checked; saveRun(); }
  if (t.id === 'runnote' && run) { run.note = t.value; saveRun(); }
  if (t.id === 'runexnote' && run) { run.items[run.idx].today = t.value; saveRun(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'exphoto' && e.target.files[0] && sheetCtx) {
    const c = sheetCtx; c.busy = true; renderSheet();
    shrinkImage(e.target.files[0]).then(b => { c.photo = b; c.preview = URL.createObjectURL(b); })
      .catch(() => toast('Non riesco a leggere questa foto: provane un\'altra'))
      .finally(() => { c.busy = false; if (sheetCtx === c) renderSheet(); });
  }
  if (e.target.id === 'impfile' && e.target.files[0]) importData(e.target.files[0]); if (e.target.id === 'ext' && sheetCtx) sheetCtx.draft.type = e.target.value; });
document.addEventListener('toggle', e => { const d = e.target; if (run && d.matches && d.matches('details[data-k]')) run['open_' + d.dataset.k] = d.open; }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && run && run.open) requestWake(); });

render();
loadPhotos();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
